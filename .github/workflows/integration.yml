name: Integration

on:
  workflow_dispatch:
  schedule:
    # Monthly on the 1st at 04:00 UTC
    - cron: "0 4 1 * *"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  integration:
    name: Local emulator and live Cloudflare publishing tests
    # Ubuntu has a Linux Docker daemon for the MinIO emulator used by the R2 tests.
    runs-on: avp-linux
    # Requires the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets to be configured.
    environment: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Install playground web dependencies
        run: npm install
        working-directory: samples/playground/CloudflarePlayground.Web

      - name: Restore
        run: dotnet restore AvantiPoint.Aspire.slnx

      - name: Integration tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Includes Docker-backed local development and isolated real Worker/R2 publish-deploy-destroy
        # coverage. MinIO is local-only; it is never published to Cloudflare.
        # Target the project directly rather than a --filter: MTP's xUnit filter syntax
        # (--filter-namespace, etc.) differs from VSTest's --filter, and this repo only
        # has one IntegrationTests project, so --project is simpler and equivalent.
        run: >
          dotnet test --project tests/AvantiPoint.Aspire.Hosting.Cloudflare.IntegrationTests/AvantiPoint.Aspire.Hosting.Cloudflare.IntegrationTests.csproj
          -c Release
