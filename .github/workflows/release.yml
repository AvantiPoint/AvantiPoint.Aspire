name: Release

# Two phases, one file:
#   1. workflow_dispatch  -> build + sign the packages, create a DRAFT GitHub Release with them
#                            attached (same build mechanism as ci.yml).
#   2. release: published -> triggered when a human reviews and publishes that draft in the
#                            GitHub UI; only then are the packages pushed to nuget.org. This keeps
#                            a manual review gate before anything public/irreversible happens.
#
# NuGet Trusted Publishing's OIDC exchange (NuGet/login) must run directly in this repo's
# workflow, not inside a shared/reusable workflow in a different repo — nuget.org validates the
# repo+workflow where the login step itself executes, and secrets can't reliably cross a
# reusable-workflow boundary the way non-secret inputs can. So publish-nuget is inline here rather
# than calling out to workflow-templates like the build/release-creation steps do.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: avantipoint/workflow-templates/.github/workflows/dotnet-build.yml@master
    permissions:
      id-token: write
      contents: read
    with:
      name: Build Package Feed
      # dotnet sign (code-sign, below) is Windows-only — see ci.yml for the same requirement.
      runs-on: windows-latest
      dotnet-version: 10.0.x
      solution-path: AvantiPoint.Aspire.slnx
      use-microsoft-testing-platform: true
      # Same exclusion as ci.yml: IntegrationTests needs Docker + Node/npm/wrangler that this job
      # doesn't provision (it's exercised by integration.yml instead).
      test-projects: |
        tests/AvantiPoint.Aspire.Hosting.Cloudflare.Tests/AvantiPoint.Aspire.Hosting.Cloudflare.Tests.csproj
        tests/AvantiPoint.Aspire.Hosting.Cloudflare.R2.Tests/AvantiPoint.Aspire.Hosting.Cloudflare.R2.Tests.csproj
        tests/AvantiPoint.Aspire.Hosting.Cloudflare.Pages.Tests/AvantiPoint.Aspire.Hosting.Cloudflare.Pages.Tests.csproj
        tests/AvantiPoint.Aspire.Hosting.Cloudflare.D1.Tests/AvantiPoint.Aspire.Hosting.Cloudflare.D1.Tests.csproj
        tests/AvantiPoint.Aspire.Hosting.Cloudflare.AI.Tests/AvantiPoint.Aspire.Hosting.Cloudflare.AI.Tests.csproj
        tests/AvantiPoint.Aspire.Hosting.Cloudflare.Vectorize.Tests/AvantiPoint.Aspire.Hosting.Cloudflare.Vectorize.Tests.csproj
        tests/AvantiPoint.Aspire.Hosting.Cloudflare.KV.Tests/AvantiPoint.Aspire.Hosting.Cloudflare.KV.Tests.csproj
        tests/AvantiPoint.Aspire.Hosting.Cloudflare.Queues.Tests/AvantiPoint.Aspire.Hosting.Cloudflare.Queues.Tests.csproj
        tests/AvantiPoint.Aspire.Hosting.Cloudflare.Hyperdrive.Tests/AvantiPoint.Aspire.Hosting.Cloudflare.Hyperdrive.Tests.csproj
        tests/AvantiPoint.Aspire.Hosting.Extensions.Tests/AvantiPoint.Aspire.Hosting.Extensions.Tests.csproj
      code-sign: true
      codeSignEndpoint: ${{ vars.CODESIGN_ENDPOINT }}
      codeSignAccountName: ${{ vars.CODESIGN_ACCOUNTNAME }}
      codeSignCertificateProfile: ${{ vars.CODESIGN_CERTIFICATEPROFILE }}
    secrets:
      codeSignClientId: ${{ secrets.CodeSignClientId }}
      codeSignTenantId: ${{ secrets.CodeSignTenantId }}

  create-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    uses: avantipoint/workflow-templates/.github/workflows/generate-release.yml@master
    permissions:
      contents: write
    with:
      # Every package in this repo shares one Nerdbank.GitVersioning-derived version (version.json
      # at the repo root); any single package's filename is enough to read the release version/tag
      # from, so the core package is used as the representative one.
      package-name: AvantiPoint.Aspire.Hosting.Cloudflare

  # Azure Artifact Signing rotates its signing certificate roughly daily (~72h validity), but
  # nuget.org's "required signer" allowlist (nuget.org account -> Certificates; separate from
  # Trusted Publishing, which only governs *who* can push, not the package's own signature) can
  # only pin a single certificate thumbprint at a time, with no API to update it — it's a manual
  # website upload (see github.com/NuGet/NuGetGallery#10027, open/unresolved as of this writing).
  # So: extract the exact leaf certificate this build's packages were actually signed with, and
  # surface it (thumbprint + downloadable .cer) so it can be registered on nuget.org *before* the
  # draft release below is published — otherwise the push succeeds but nuget.org's signature
  # validation silently fails against a stale registered thumbprint.
  extract-certificate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download signed packages
        uses: actions/download-artifact@v8
        with:
          name: NuGet
          path: Artifacts/

      - name: Extract signing certificate
        shell: bash
        run: |
          set -euo pipefail

          # Any one signed .nupkg carries the same leaf certificate this whole build was signed with.
          nupkg=$(find Artifacts -maxdepth 1 -name '*.nupkg' | head -1)
          echo "Extracting signature from $(basename "$nupkg")"

          unzip -p "$nupkg" .signature.p7s > sig.p7s
          # The signature is a PKCS#7/CMS blob containing the full chain (leaf + intermediates);
          # pull every certificate out, then isolate the leaf below.
          openssl pkcs7 -inform DER -in sig.p7s -print_certs -out chain.pem
          csplit -s -z -f cert- -b '%02d.pem' chain.pem '/-----BEGIN CERTIFICATE-----/' '{*}'

          leaf=""
          for cert in cert-*.pem; do
            subject=$(openssl x509 -in "$cert" -noout -subject 2>/dev/null || true)
            # The leaf is the AvantiPoint, LLC end-entity cert, not one of the Microsoft CA/root
            # certs also present in the chain.
            if [[ "$subject" == *"AvantiPoint"* ]]; then
              leaf="$cert"
              break
            fi
          done

          if [[ -z "$leaf" ]]; then
            echo "::error::Could not find the AvantiPoint leaf certificate in the package signature chain."
            exit 1
          fi

          openssl x509 -in "$leaf" -outform DER -out AvantiPoint.cer
          {
            echo "subject=$(openssl x509 -in "$leaf" -noout -subject -nameopt oneline | sed 's/^subject=//')"
            echo "serial=$(openssl x509 -in "$leaf" -noout -serial | cut -d= -f2)"
            echo "sha1=$(openssl x509 -in "$leaf" -noout -fingerprint -sha1 | cut -d= -f2)"
            echo "sha256=$(openssl x509 -in "$leaf" -noout -fingerprint -sha256 | cut -d= -f2)"
            echo "notafter=$(openssl x509 -in "$leaf" -noout -enddate | cut -d= -f2)"
          } >> "$GITHUB_ENV"

      - name: Summarize
        shell: bash
        run: |
          {
            echo "## NuGet.org signing certificate for this release"
            echo
            echo "Azure Artifact Signing rotates this certificate roughly every 24h (~72h validity)."
            echo "**Register it on nuget.org before publishing the draft release**, or nuget.org's"
            echo "signature validation will silently fail against a stale thumbprint even though the"
            echo "push itself succeeds."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Subject | \`$subject\` |"
            echo "| Serial | \`$serial\` |"
            echo "| SHA-1 thumbprint | \`$sha1\` |"
            echo "| SHA-256 fingerprint | \`$sha256\` |"
            echo "| Valid until | $notafter |"
            echo
            echo "1. Download the \`nuget-signing-certificate\` artifact from this run (the \`.cer\` file below)."
            echo "2. Go to nuget.org -> your account -> **Certificates** -> register/upload it"
            echo "   (there is no API for this step — it's website-only)."
            echo "3. Only then publish the draft GitHub Release, which triggers the nuget.org push."
            echo
            echo "_Tracking the durable fix: [NuGet/NuGetGallery#10027](https://github.com/NuGet/NuGetGallery/issues/10027)_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certificate artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-signing-certificate
          path: AvantiPoint.cer
          retention-days: 14

  publish-nuget:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    # A release-published run does not execute build (that job is dispatch-only). It downloads the
    # signed packages attached to the reviewed draft release, so it must not depend on build.
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.13
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.tag_name }}
          fileName: "*"
          out-file-path: Artifacts/
          tarBall: false
          zipBall: false

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          # Your nuget.org profile name (not email). Requires a Trusted Publishing policy on
          # nuget.org scoped to this repo + this workflow file (release.yml) + the "production"
          # environment — see the PR description for the one-time setup steps.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        run: |
          $key = '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'
          Get-ChildItem Artifacts -Filter *.nupkg | ForEach-Object {
            Write-Host "Publishing $($_.Name)"
            # Symbol packages (.snupkg) publish automatically alongside a co-located .nupkg of the
            # same name, so only .nupkg files need to be pushed explicitly here.
            dotnet nuget push $_.FullName `
              --api-key $key `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            # A later successful push resets $LASTEXITCODE to 0, which would silently mask an
            # earlier failed one if left unchecked — check and fail fast after every push.
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish $($_.Name)" }
          }
