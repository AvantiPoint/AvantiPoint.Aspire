name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CI: true

jobs:
  build:
    name: Build, Test & Publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0 # full history required for Nerdbank.GitVersioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4.0
        with:
          nuget-version: latest

      - name: Restore
        run: dotnet restore AvantiPoint.Aspire.slnx

      - name: Build
        run: dotnet build AvantiPoint.Aspire.slnx -c Release --no-restore

      - name: Test (unit only)
        run: >
          dotnet test AvantiPoint.Aspire.slnx -c Release --no-build
          --filter "FullyQualifiedName!~IntegrationTests"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Pack
        run: dotnet pack AvantiPoint.Aspire.slnx -c Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: ./TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload NuGet packages
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget
          path: Artifacts/*.nupkg
          if-no-files-found: warn

      - name: Publish to in-house feed
        if: ${{ github.event_name != 'pull_request' }}
        uses: dansiegel/publish-nuget@v1.2
        with:
          filename: 'Artifacts/*.nupkg'
          feedUrl: ${{ secrets.IN_HOUSE_NUGET_FEED }}
          apiKey: ${{ secrets.IN_HOUSE_API_KEY }}
