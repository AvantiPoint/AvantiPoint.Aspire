name: Bug report
description: Report a problem with an AvantiPoint.Aspire Cloudflare integration
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, generated publish artifacts or unredacted logs. For vulnerabilities, follow SECURITY.md.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package does this affect?
      options:
        - Core hosting / deployment / custom domains
        - R2
        - D1
        - Workers / Containers / Pages
        - AI / AI Gateway
        - Vectorize / KV / Queues / Hyperdrive
        - Shared hosting extensions
        - TypeScript AppHost / interop
        - Documentation / build
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal AppHost wiring and the command you ran (`aspire run` / `aspire deploy`).
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Affected package/version, Aspire CLI version, .NET SDK, Node/wrangler versions, OS, and C# or TypeScript AppHost.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted log output
      description: Remove secrets and connection strings. Do not upload generated Worker or publish output.
      render: shell
